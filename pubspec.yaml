name: habit_tracker_app
description: "A scalable, production-ready offline-first Habit Tracker App built with Clean Architecture, Riverpod, sqflite, and go_router."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Cupertino icons for iOS style
  cupertino_icons: ^1.0.6

  # State Management
  flutter_riverpod: ^2.5.1

  # Local SQLite Database
  sqflite: ^2.3.0
  path: ^1.9.0

  # Routing
  go_router: ^14.0.1

  # Core Utilities
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
